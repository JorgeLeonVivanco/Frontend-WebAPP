<div class="login-container container-fluid">
  <div class="row align-items-center">
    <div class="col-lg-6 text-center logo-container">
      <img src="../../../../assets/img/logo.png" alt="Logo" class="img-fluid logo">
    </div>
    <div class="col-lg-6 form-container">
      <form [formGroup]="loginForm" class="shadow p-5 bg-white rounded">
        <h1 class="titulo1 text-center">ACCESO</h1>
        <div class="mb-3">
          <label for="exampleInputMatricula1" class="form-label titulo3">Matrícula</label>
          <input formControlName="matricula" class="form-control campo" id="exampleInputMatricula1">
          <div *ngIf="matricula?.invalid && (matricula?.dirty || matricula?.touched)" class="text-danger titulo3">
            <div *ngIf="matricula?.errors?.['required']">*Matrícula requerida.</div>
          </div>
        </div>
        <div class="mb-3">
          <label for="exampleInputPassword1" class="form-label titulo3">Contraseña</label>
          <input formControlName="password" type="password" class="form-control campo" id="exampleInputPassword1">
          <div *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="text-danger titulo3">
            <div *ngIf="password?.errors?.['required']">*Contraseña requerida.</div>
          </div>
        </div>
        <button type="submit" (click)="login()" class="btn btn-primary w-100 titulo3">Iniciar sesión</button>
      </form>
    </div>
  </div>
</div>
